{% extends 'base.html' %}
{% block title %}

{% endblock %}
{% block content %}
    <div class="row">
        {% if messages %}
        <ul class="messages">
            {% for message in messages %}
                <li {% if message.tags %} class="{{ message.tags }}" {% endif %}>
                    <div class="col-md-12" align="Center"> {{ message }} </div>
                </li>
            {% endfor %}
        </ul>
        {% endif %}
        <div class="col-md-2 ms-auto">
            <a class="btn btn-primary" href="{% url 'home' %}"> ОК </a>
        </div>
    </div>
{% endblock %}
