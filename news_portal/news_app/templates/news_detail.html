{% extends 'base.html' %}
{% block title %}
{% endblock %}
{% block content %}
    <div class="card">
        <div class="card-header">
            <h1> {{ header }} </h1>
        </div>
        <div class="card-body">
            {{ content }}
        </div>
    </div>
    <div class="row">
        <div class="col-md-12">
            <h1 align="Center"> {{ title }} </h1>
        </div>
        <div class="col-md-12">
            <h3> {{ summary }} </h3>
        </div>
        <div class="col-md-12">
            {{ content }}
        </div>
        <div class="col-md-2 ms-auto">
            {{ date }}
        </div>
    </div>
    <div class="row">
        <div class="col-md-2 ms-auto">
            <a class="btn-primary" href="../"></a>
        </div>
    </div>
{% endblock %}
