{% extends "base.html" %}
{% block title %}
    Home
{% endblock %}
{% block content %}
    <div class="col-md-12">
        <h1>Новостной портал</h1>
    </div>
    <div class="co-md-12">
        {% if news_list %}
            <ul style="list-style-type: none;">
                {% for news in news_list %}
                    <li>
                        <div class="card border-info">
                            <ul class="list-group list-group-flush">
                                <a class="list-group-item list-group-item-info list-group-item-action" href="news/{{ news.id }}">
                                    <h2> {{ news.title }} </h2>
                                </a>
                                <a class="list-group-item list-group-item-action" href="news/{{ news.id }}">
                                    <h5> {{ news.summary }}</h5>
                                </a>
                            </ul>
                        </div>
                    </li>
                {% endfor %}
            </ul>
        {% else %}
            <h2> Новостей пока что нет </h2>
        {% endif %}
    </div>
{% endblock %}
