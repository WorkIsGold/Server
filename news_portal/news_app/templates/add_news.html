{% extends 'base.html' %}
{% block title %}
{% endblock %}
{% block content %}
    Добавление новости
    <form method="post">
        {% csrf_token %}
        <table>
            {{ form.as_p }}
        </table>
        <input type="submit" value="Отправить">
    </form>
    {% if form.errors %}
        <p>Некорректные данные:</p>
        {% for error in form.errors %}
            {{ error }}
        {% endfor %}
    {% endif %}
{% endblock %}
